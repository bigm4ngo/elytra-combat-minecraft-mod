// Loom 1.15 ships two plugin ids: the classic remapping plugin (obfuscated 1.21.x, with
// mappings) and 'net.fabricmc.fabric-loom' (unobfuscated 26.x, no remapping, no mappings).
// Which one applies is a per-target decision, so the plugin is applied dynamically
// after the target is resolved below.
buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${project.loom_version}"
    }
}

// ---------------------------------------------------------------------------
// Multi-version build matrix.
//
// Each target compiles the same shared sources plus one compat flavor against a
// specific Minecraft version. A flavor supplies the same-FQCN Compat class (and,
// for the oldest line, its own damage mixin) that paper over the vanilla API
// changes between generations. Runtime ranges rely on intermediary/official name
// stability verified across every version in the range.
//
// Targets ending in "v" are verification-only: they compile an existing flavor
// against the *other* endpoint of its claimed range (and against 26.1.1 for the
// shipped 26.1.x line) but are not released.
// ---------------------------------------------------------------------------
def TARGETS = [
        // 1.21 - 1.21.1: LivingEntity#hurt era, no use_cooldown component,
        // primitive NBT getters, ResourceLocation ids.
        'mc1211': [
                mc: '1.21.1', suffix: 'mc1.21.1', flavor: 'legacy', javaRelease: 21,
                fabricApi: '0.116.17+1.21.1', modmenu: '11.0.4',
                mcDepends: '>=1.21 <=1.21.1', javaDepends: '>=21', modmenuSuggests: '>=11.0.0',
        ],
        // 1.21.2 - 1.21.4: hurtServer + use_cooldown component era, still
        // ResourceLocation ids, primitive NBT getters, hasPermission(int).
        'mc1212': [
                mc: '1.21.2', suffix: 'mc1.21.2-1.21.4', flavor: 'mid1', javaRelease: 21,
                fabricApi: '0.106.1+1.21.2', modmenu: '12.0.1',
                mcDepends: '>=1.21.2 <=1.21.4', javaDepends: '>=21', modmenuSuggests: '>=12.0.0',
        ],
        'mc1214v': [
                mc: '1.21.4', suffix: 'verify', flavor: 'mid1', javaRelease: 21,
                fabricApi: '0.119.4+1.21.4', modmenu: '13.0.4',
                mcDepends: '>=1.21.2 <=1.21.4', javaDepends: '>=21', modmenuSuggests: '>=12.0.0',
                verifyOnly: true,
        ],
        // 1.21.5 - 1.21.10: NBT getters return Optional (get*Or(key, default)),
        // MobEffects.CONFUSION is named NAUSEA, stopFallFlying moved to LivingEntity.
        'mc1215': [
                mc: '1.21.5', suffix: 'mc1.21.5-1.21.10', flavor: 'mid2', javaRelease: 21,
                fabricApi: '0.128.2+1.21.5', modmenu: '14.0.2',
                mcDepends: '>=1.21.5 <=1.21.10', javaDepends: '>=21', modmenuSuggests: '>=14.0.0',
        ],
        'mc12110v': [
                mc: '1.21.10', suffix: 'verify', flavor: 'mid2', javaRelease: 21,
                fabricApi: '0.138.4+1.21.10', modmenu: '16.0.1',
                mcDepends: '>=1.21.5 <=1.21.10', javaDepends: '>=21', modmenuSuggests: '>=14.0.0',
                verifyOnly: true,
        ],
        // 1.21.11: ResourceLocation -> Identifier, Permissions API replaces
        // hasPermission(int), forceSetRotation(float,boolean,float,boolean).
        'mc12111': [
                mc: '1.21.11', suffix: 'mc1.21.11', flavor: 'modern', javaRelease: 21,
                fabricApi: '0.141.6+1.21.11', modmenu: '17.0.0',
                mcDepends: '>=1.21.11 <1.22', javaDepends: '>=21', modmenuSuggests: '>=17.0.0',
        ],
        // 26.1.x / 26.2: unobfuscated, Java 25, same modern flavor as 1.21.11.
        'mc2611v': [
                mc: '26.1.1', suffix: 'verify', flavor: 'modern', javaRelease: 25,
                fabricApi: '0.145.4+26.1.1', modmenu: '18.0.0-beta.1',
                mcDepends: '>=26.1 <=26.1.2', javaDepends: '>=25', modmenuSuggests: '>=18.0.0',
                verifyOnly: true,
        ],
        'mc2612': [
                mc: '26.1.2', suffix: 'mc26.1.x', flavor: 'modern', javaRelease: 25,
                fabricApi: '0.155.2+26.1.2', modmenu: '18.0.0',
                mcDepends: '>=26.1 <=26.1.2', javaDepends: '>=25', modmenuSuggests: '>=18.0.0',
        ],
        'mc262': [
                mc: '26.2', suffix: 'mc26.2', flavor: 'modern', javaRelease: 25,
                fabricApi: '0.159.0+26.2', modmenu: '20.0.1',
                mcDepends: '>=26.2 <26.3', javaDepends: '>=25', modmenuSuggests: '>=20.0.0',
        ],
]

def targetId = project.findProperty('target') ?: 'mc2612'
def target = TARGETS[targetId]
if (target == null) {
    throw new GradleException("Unknown -Ptarget=${targetId}. Available: ${TARGETS.keySet().sort().join(', ')}")
}

// 26.x jars are unobfuscated and ship no Mojang mappings; 1.21.x needs them.
def obfuscated = !target.mc.startsWith('26.')

apply plugin: obfuscated ? 'fabric-loom' : 'net.fabricmc.fabric-loom'


version = "${project.mod_version}+${target.suffix}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
}

sourceSets {
    main {
        java {
            srcDir "src/compat/${target.flavor}/java"
            if (target.flavor == 'legacy') {
                // The shared damage mixin targets ServerPlayer#hurtServer, which does not
                // exist on 1.21/1.21.1; the legacy flavor ships its own in its place.
                exclude 'dev/elytracombat/mixin/ServerPlayerDamageMixin.java'
            }
        }
        if (target.flavor == 'legacy') {
            resources {
                srcDir 'src/compat/legacy/resources'
                exclude 'elytra_combat.mixins.json'
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${target.mc}"
    if (obfuscated) {
        mappings loom.officialMojangMappings()
        // Mixin annotations: on the unobfuscated line loom's loader wiring provides these,
        // but declare them explicitly for the 1.21.x builds so compilation never depends
        // on loader-json library processing. Mixin reference remapping to intermediary
        // names happens at remap time (loom's mercurymixin), so no refmap is needed.
        implementation 'net.fabricmc:sponge-mixin:0.17.0+mixin.0.8.7'
    }
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    if (obfuscated) {
        // Mod dependencies ship with intermediary names and must be remapped to the
        // compile mappings; on the unobfuscated 26.x line 'implementation' is enough.
        modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        modImplementation "com.terraformersmc:modmenu:${target.modmenu}"
    } else {
        implementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        implementation "com.terraformersmc:modmenu:${target.modmenu}"
    }
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    def expandProps = [
            version          : project.version,
            minecraftDepends : target.mcDepends,
            javaDepends      : target.javaDepends,
            modmenuSuggests  : target.modmenuSuggests,
            mixinConfig      : target.flavor == 'legacy' ? 'elytra_combat.mixins.legacy.json' : 'elytra_combat.mixins.json',
    ]
    inputs.properties(expandProps)
    filesMatching('fabric.mod.json') {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = target.javaRelease as Integer
}

java {
    withSourcesJar()
    def release = target.javaRelease as Integer
    sourceCompatibility = release >= 25 ? JavaVersion.VERSION_25 : JavaVersion.VERSION_21
    targetCompatibility = release >= 25 ? JavaVersion.VERSION_25 : JavaVersion.VERSION_21
}

if (target.verifyOnly) {
    // Verification targets never ship: building them stops after compilation.
    tasks.named('build') {
        dependsOn 'compileJava', 'testClasses'
    }
    tasks.matching { it.name in ['jar', 'remapJar', 'remapSourcesJar', 'sourcesJar'] }.configureEach {
        enabled = false
    }
}
