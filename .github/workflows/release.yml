name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Verify range endpoints (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [mc1214v, mc12110v, mc2611v]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile ${{ matrix.target }}
        run: ./gradlew -Ptarget=${{ matrix.target }} build --stacktrace

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [mc1211, mc1212, mc1215, mc12111, mc2612, mc262]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.target }}
        run: ./gradlew -Ptarget=${{ matrix.target }} build --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.target }}
          path: build/libs/elytra-combat-*+mc*.jar
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all jars
        uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum elytra-combat-*.jar > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/releases/v1.3.3.md
          files: |
            dist/elytra-combat-*.jar
            dist/SHA256SUMS
