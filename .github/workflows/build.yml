name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [mc1211, mc1212, mc1215, mc12111, mc2612, mc262]
    name: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew -Ptarget=${{ matrix.target }} build --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elytra-combat-${{ matrix.target }}
          path: build/libs/elytra-combat-*+mc*.jar
          if-no-files-found: error